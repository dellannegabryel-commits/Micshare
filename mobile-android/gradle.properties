# Project-wide Gradle settings.

org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.enableJetifier=true

kotlin.code.style=official

android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Release signing: configure via ~/.gradle/gradle.properties ou variáveis de
# ambiente (ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD). Sem elas, o build release usa a chave de debug.
