name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools-version: '35.0.0'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/**/*.gradle*', 'mobile/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - run: chmod +x mobile/gradlew

      - run: ./gradlew :app:assembleDebug --stacktrace
        working-directory: mobile

      - uses: actions/upload-artifact@v4
        with:
          name: micshare-debug-apk
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  lint:
    name: Lint & Compile
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools-version: '35.0.0'

      - run: chmod +x mobile/gradlew

      - run: ./gradlew :app:compileDebugKotlin --stacktrace
        working-directory: mobile

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: mobile/app/build/reports/lint-results-debug.html
          retention-days: 7