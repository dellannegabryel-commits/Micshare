name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r27b
          build-tools-version: 34.0.0

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x mobile/gradlew
        working-directory: mobile

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug
        working-directory: mobile

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: micshare-debug-apk
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Build Release APK (unsigned)
        run: ./gradlew :app:assembleRelease
        working-directory: mobile

      - name: Upload Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: micshare-release-apk-unsigned
          path: mobile/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7

  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r27b
          build-tools-version: 34.0.0

      - name: Grant execute permission for gradlew
        run: chmod +x mobile/gradlew
        working-directory: mobile

      - name: Run Lint
        run: ./gradlew :app:lintDebug
        working-directory: mobile

      - name: Run Kotlin compile check
        run: ./gradlew :app:compileDebugKotlin
        working-directory: mobile

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: mobile/app/build/reports/lint-results-debug.html
          retention-days: 7