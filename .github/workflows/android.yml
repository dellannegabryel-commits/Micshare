name: Android Build

on:
  push:
    branches: [main, develop]
    paths:
      - 'mobile/**'
      - 'packages/protocol/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'packages/protocol/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install dependencies
        run: |
          npm --prefix mobile install

      - name: Verify TypeScript
        run: |
          npm --prefix mobile run typecheck

      - name: Expo prebuild
        working-directory: ./mobile
        run: npx expo prebuild --platform android --no-install

      - name: Patch Android configurations for AGP 8
        working-directory: ./mobile/android
        run: |
          # 1. Disable automatic component creation to fix maven publish error
          echo "android.disableAutomaticComponentCreation=true" >> gradle.properties

          # 2. Add namespace fallback for libraries lacking namespace in build.gradle
          cat << 'EOF' >> build.gradle

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            if (project.android.namespace == null) {
                def manifestFile = file("${project.projectDir}/src/main/AndroidManifest.xml")
                if (manifestFile.exists()) {
                    def manifestText = manifestFile.getText('UTF-8')
                    def matcher = manifestText =~ /package="([^"]+)"/
                    if (matcher.find()) {
                        project.android.namespace = matcher.group(1)
                    }
                }
            }
        }
    }
}
EOF

          # 3. Allow cleartext traffic for local network WebSocket
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' app/src/main/AndroidManifest.xml

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/android/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        working-directory: ./mobile/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./mobile/android
        run: ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Build Summary
        if: always()
        run: |
          echo "Build finished!"
          ls -la mobile/android/app/build/outputs/apk/debug/ || true
