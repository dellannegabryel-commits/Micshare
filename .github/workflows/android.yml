name: Android Build

on:
  push:
    branches: [main, develop]
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ''

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 34
          ndk-version: r26d
          emulator: false

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/gradle-wrapper.properties', 'mobile/android/**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install mobile dependencies
        working-directory: ./mobile
        run: npm install

      - name: Expo prebuild (generate android folder)
        working-directory: ./mobile
        run: npx expo prebuild --platform android --no-install

      - name: Fix build.gradle properties
        working-directory: ./mobile
        run: bash fix_gradle.sh

      - name: Apply React Native 0.74 patches
        working-directory: ./mobile
        run: |
          for patch in patches/*.patch; do
            echo "Applying $patch..."
            patch -p1 < "$patch" || echo "Patch $patch failed (may already be applied)"
          done

      - name: Make gradlew executable
        working-directory: ./mobile/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./mobile/android
        run: ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload APK info
        if: always()
        run: |
          echo "Build completed!"
          ls -la mobile/android/app/build/outputs/apk/debug/ || true
