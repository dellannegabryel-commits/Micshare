name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
      apk_path: ${{ steps.rename_apk.outputs.apk_path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: extract_version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264
          accept-android-sdk-licenses: true

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile-android/**/*.gradle.kts', 'mobile-android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Decode Android keystore
        id: decode_keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ${{ runner.temp }}/keystore.jks
          echo "keystore_path=${{ runner.temp }}/keystore.jks" >> $GITHUB_OUTPUT

      - name: Configure Android signing
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: ./mobile-android
        run: |
          cat > gradle.properties <<EOF
          android.keystore.path=${{ steps.decode_keystore.outputs.keystore_path }}
          android.keystore.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          android.key.alias=${{ secrets.ANDROID_KEY_ALIAS }}
          android.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Make gradlew executable
        working-directory: ./mobile-android
        run: chmod +x gradlew

      - name: Update version in build.gradle.kts
        working-directory: ./mobile-android
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          # Update versionName and versionCode in build.gradle.kts
          sed -i "s/versionName = \".*\"/versionName = \"$VERSION\"/" app/build.gradle.kts
          # Calculate versionCode from semver (major*1000000 + minor*10000 + patch*100)
          IFS='.' read -r major minor patch <<< "$VERSION"
          versionCode=$((major * 1000000 + minor * 10000 + patch * 100))
          sed -i "s/versionCode = [0-9]*/versionCode = $versionCode/" app/build.gradle.kts
          echo "Updated versionName to $VERSION, versionCode to $versionCode"

      - name: Build Release APK
        working-directory: ./mobile-android
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Rename and copy APK
        id: rename_apk
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          SRC="mobile-android/app/build/outputs/apk/release/app-release.apk"
          DEST="Micshare-${VERSION}.apk"
          cp "$SRC" "$DEST"
          echo "apk_path=$DEST" >> $GITHUB_OUTPUT
          ls -la "$DEST"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Micshare-android-${{ steps.extract_version.outputs.version }}
          path: Micshare-${{ steps.extract_version.outputs.version }}.apk
          retention-days: 30

  build-windows:
    name: Build Windows Installers
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
      msi_path: ${{ steps.rename_msi.outputs.msi_path }}
      exe_path: ${{ steps.rename_exe.outputs.exe_path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: extract_version
        run: |
          $version = "${GITHUB_REF_NAME}".TrimStart('v')
          echo "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version: $version"

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/pc-ui/package-lock.json

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            packages/pc-ui/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('packages/pc-ui/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install Node dependencies
        working-directory: ./packages/pc-ui
        run: npm ci

      - name: Update version in package.json
        working-directory: ./packages/pc-ui
        run: |
          $version = "${{ steps.extract_version.outputs.version }}"
          npm version $version --no-git-tag-version --allow-same-version

      - name: Update version in Cargo.toml
        working-directory: ./packages/pc-ui/src-tauri
        run: |
          $version = "${{ steps.extract_version.outputs.version }}"
          (Get-Content Cargo.toml) -replace 'version = ".*"', "version = \"$version\"" | Set-Content Cargo.toml

      - name: Update version in tauri.conf.json
        working-directory: ./packages/pc-ui/src-tauri
        run: |
          $version = "${{ steps.extract_version.outputs.version }}"
          $json = Get-Content tauri.conf.json | ConvertFrom-Json
          $json.version = $version
          $json | ConvertTo-Json -Depth 10 | Set-Content tauri.conf.json

      - name: Build Tauri App
        working-directory: ./packages/pc-ui
        env:
          PATH: ${{ env.PATH }};C:\Users\runneradmin\.cargo\bin
        run: npm run tauri:build

      - name: Find and rename MSI
        id: rename_msi
        run: |
          $version = "${{ steps.extract_version.outputs.version }}"
          $src = Get-ChildItem "packages/pc-ui/src-tauri/target/release/bundle/msi/" -Filter "*.msi" | Select-Object -First 1
          $dest = "Micshare-${version}_x64.msi"
          Copy-Item $src.FullName $dest
          echo "msi_path=$dest" >> $env:GITHUB_OUTPUT
          Write-Host "MSI: $dest"
          ls -la $dest

      - name: Find and rename NSIS EXE
        id: rename_exe
        run: |
          $version = "${{ steps.extract_version.outputs.version }}"
          $src = Get-ChildItem "packages/pc-ui/src-tauri/target/release/bundle/nsis/" -Filter "*.exe" | Select-Object -First 1
          $dest = "Micshare-${version}_x64-setup.exe"
          Copy-Item $src.FullName $dest
          echo "exe_path=$dest" >> $env:GITHUB_OUTPUT
          Write-Host "EXE: $dest"
          ls -la $dest

      - name: Upload Windows MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Micshare-windows-msi-${{ steps.extract_version.outputs.version }}
          path: Micshare-${{ steps.extract_version.outputs.version }}_x64.msi
          retention-days: 30

      - name: Upload Windows NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Micshare-windows-nsis-${{ steps.extract_version.outputs.version }}
          path: Micshare-${{ steps.extract_version.outputs.version }}_x64-setup.exe
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: Micshare-android-${{ needs.build-android.outputs.version }}
          path: ./release-assets

      - name: Download Windows MSI
        uses: actions/download-artifact@v4
        with:
          name: Micshare-windows-msi-${{ needs.build-windows.outputs.version }}
          path: ./release-assets

      - name: Download Windows NSIS
        uses: actions/download-artifact@v4
        with:
          name: Micshare-windows-nsis-${{ needs.build-windows.outputs.version }}
          path: ./release-assets

      - name: List release assets
        run: ls -la ./release-assets/

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION="${{ needs.build-android.outputs.version }}"
          # Get commits since last tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s (%h)" $PREV_TAG..HEAD)
          else
            NOTES=$(git log --pretty=format:"- %s (%h)" -n 20)
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "## Micshare v$VERSION" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### Downloads" >> $GITHUB_OUTPUT
          echo "- **Android**: \`Micshare-$VERSION.apk\`" >> $GITHUB_OUTPUT
          echo "- **Windows (NSIS)**: \`Micshare-${VERSION}_x64-setup.exe\`" >> $GITHUB_OUTPUT
          echo "- **Windows (MSI)**: \`Micshare-${VERSION}_x64.msi\`" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Micshare ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.notes }}
          files: |
            ./release-assets/Micshare-${{ needs.build-android.outputs.version }}.apk
            ./release-assets/Micshare-${{ needs.build-windows.outputs.version }}_x64-setup.exe
            ./release-assets/Micshare-${{ needs.build-windows.outputs.version }}_x64.msi
          draft: false
          prerelease: false
          generate_release_notes: false