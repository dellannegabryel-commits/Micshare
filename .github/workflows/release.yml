name: Release

# Dispara apenas em tags v*.*.* (ou manualmente via workflow_dispatch).
# Nada é publicado no GitHub sem passar pela guarda "release já existe?" do job prepare.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a preparar (ex.: v0.4.0). Vazio = usa a ref que disparou o workflow.'
        required: false
        type: string
      publish:
        description: 'Publicar a release no GitHub? (false = dry-run, só gera artefatos)'
        required: false
        default: false
        type: boolean

# Leitura por padrão; escrita só no job que publica.
permissions:
  contents: read

# Evita duas builds concorrentes na mesma tag.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  JDK_VERSION: '21'
  ANDROID_SDK: '35'

jobs:
  prepare:
    name: Preparar versão
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolver tag e versão
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          case "$TAG" in
            v*) VERSION="${TAG#v}" ;;
            *)  VERSION="$TAG" ;;
          esac
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Versão inválida: '$VERSION' (esperado semver, ex.: 0.4.0)"
            exit 1
          fi
          echo "tag=$TAG"    >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Preparando $TAG (versão $VERSION)"

      # Guarda anti-poluição: se a release da tag já existe, não publica nada.
      - name: Decidir publicação
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          # Push de tag publica (salvo se a release já existir);
          # execução manual publica apenas com publish=true.
          REQUEST="$REQUESTED"
          if [ "$EVENT" = "push" ]; then
            REQUEST=true
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::A release $TAG já existe — publicação bloqueada, nada será alterado no GitHub."
          elif [ "${REQUEST:-false}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Publicando a release $TAG."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dry-run: os artefatos serão gerados, mas nenhuma release será criada."
          fi

      - name: Sincronizar versão nos manifests
        run: node scripts/set-version.mjs "${{ steps.version.outputs.version }}"

      - name: Verificar consistência da versão
        run: node scripts/set-version.mjs --check "${{ steps.version.outputs.version }}"

  build-android:
    name: Build Android APK
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup JDK ${{ env.JDK_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JDK_VERSION }}
          cache: gradle

      - name: Setup Android SDK ${{ env.ANDROID_SDK }}
        uses: android-actions/setup-android@v4
        with:
          # compileSdk do projeto é 35: instalar o 34 quebrava o build.
          packages: platforms;android-${{ env.ANDROID_SDK }} build-tools;${{ env.ANDROID_SDK }}.0.0 platform-tools
          accept-android-sdk-licenses: true

      # O cache do Gradle vem do setup-java (cache: gradle), que já cobre
      # ~/.gradle/caches e ~/.gradle/wrapper — sem cache duplicado aqui.

      - name: Sincronizar versão nos manifests
        run: node scripts/set-version.mjs "${{ needs.prepare.outputs.version }}"

      - name: Make gradlew executable
        working-directory: ./mobile
        run: chmod +x gradlew

      # O contexto `secrets` NÃO é permitido em `if` de step (só `env`/`with`).
      # Por isso a disponibilidade do keystore é avaliada num step próprio e as
      # condições seguintes usam o output `signed` desse step.
      - name: Verificar disponibilidade do keystore
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Keystore de release encontrado — APK será assinado."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Sem secrets ANDROID_KEYSTORE_BASE64 — o APK usará a chave de debug."
          fi

      - name: Decode Android keystore
        id: decode_keystore
        if: ${{ steps.signing.outputs.signed == 'true' }}
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          echo "keystore_path=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_OUTPUT"

      - name: Configure Android signing
        if: ${{ steps.signing.outputs.signed == 'true' }}
        working-directory: ./mobile
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ steps.decode_keystore.outputs.keystore_path }}
        run: |
          set -euo pipefail

          # O alias do keystore e "micshare", mas o secret foi gravado com um
          # espaco a esquerda (" micshare"). Sem o trim, a assinatura falha.
          KEY_ALIAS="$(printf '%s' "$KEY_ALIAS" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::O secret ANDROID_KEY_ALIAS ficou vazio depois do trim."
            exit 1
          fi

          # O build.gradle.kts usa a MESMA propriedade (android.keystore.password)
          # para storePassword e keyPassword: os dois secrets precisam bater.
          if [ "$KEYSTORE_PASSWORD" != "$KEY_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD e ANDROID_KEY_PASSWORD divergem — o build.gradle.kts usa 'android.keystore.password' para os dois. Alinhe os secrets."
            exit 1
          fi

          # As propriedades sao ANEXADAS (e nao sobrescritas) para preservar
          # android.useAndroidX=true e o restante do gradle.properties versionado.
          # Os nomes abaixo sao exatamente os lidos por mobile/app/build.gradle.kts.
          {
            printf '\n'
            printf '# --- Injetado pelo CI (release signing) ---\n'
            printf 'android.keystore.path=%s\n' "$KEYSTORE_PATH"
            printf 'android.keystore.password=%s\n' "$KEYSTORE_PASSWORD"
            printf 'android.keystore.alias=%s\n' "$KEY_ALIAS"
          } >> gradle.properties

          echo "Configuracao de assinatura do release aplicada (espacos do alias removidos)."
          grep -E '^android\.(useAndroidX|enableJetifier|nonTransitiveRClass|nonFinalResIds)=' gradle.properties || true

      - name: Build release APK
        working-directory: ./mobile
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verificar metadados do APK
        working-directory: ./mobile
        shell: bash
        run: |
          set -euo pipefail
          cat app/build/outputs/apk/release/output-metadata.json

      - name: Renomear APK
        id: rename_apk
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          SRC="mobile/app/build/outputs/apk/release/app-release.apk"
          DEST="Micshare-${VERSION}.apk"
          cp "$SRC" "$DEST"
          echo "apk_path=$DEST" >> "$GITHUB_OUTPUT"
          ls -la "$DEST"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Micshare-android-${{ needs.prepare.outputs.version }}
          path: Micshare-${{ needs.prepare.outputs.version }}.apk
          retention-days: 30

  build-windows:
    name: Build Windows installers
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            pc/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('pc/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # A versão é aplicada por script (nunca por regex no Cargo.toml, que
      # corromperia as versões das dependências).
      - name: Sincronizar versão nos manifests
        run: node scripts/set-version.mjs "${{ needs.prepare.outputs.version }}"

      - name: Install Node dependencies
        run: npm ci

      - name: Build Tauri App
        working-directory: ./pc
        # Sem override de PATH: o cargo do rust-toolchain ja esta no PATH do
        # runner, e sobrescrever PATH aqui quebraria o npm/node se o
        # ${{ env.PATH }} viesse vazio.
        run: npm run tauri:build

      - name: Verificar versão do executável
        shell: pwsh
        run: |
          $exe = Get-Item "pc/src-tauri/target/release/micshare-pc-ui.exe"
          Write-Host "ProductVersion: $($exe.VersionInfo.ProductVersion)"
          if ($exe.VersionInfo.ProductVersion -ne "${{ needs.prepare.outputs.version }}") {
            Write-Error "Versão do exe ($($exe.VersionInfo.ProductVersion)) difere da tag"
            exit 1
          }

      - name: Coletar artefatos
        id: collect
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          $out = "release-assets"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $msi = Get-ChildItem "pc/src-tauri/target/release/bundle/msi/" -Filter "*.msi" |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Copy-Item $msi.FullName "$out/Micshare-${version}_x64.msi"

          $nsis = Get-ChildItem "pc/src-tauri/target/release/bundle/nsis/" -Filter "*.exe" |
                  Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Copy-Item $nsis.FullName "$out/Micshare-${version}_x64-setup.exe"

          Copy-Item "pc/src-tauri/target/release/micshare-pc-ui.exe" "$out/Micshare-${version}_x64-portable.exe"

          Get-ChildItem $out | Select-Object Name, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Micshare-windows-${{ needs.prepare.outputs.version }}
          path: release-assets/
          retention-days: 30

  publish:
    name: Publicar release
    needs: [prepare, build-android, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Resumo dry-run
        if: ${{ needs.prepare.outputs.publish != 'true' }}
        shell: bash
        run: |
          echo "::notice::Dry-run concluído para ${{ needs.prepare.outputs.tag }}."
          echo "Os artefatos ficaram disponíveis em Actions → Artifacts."
          echo "Nenhuma release foi criada ou alterada no GitHub."

      - name: Download artifacts
        if: ${{ needs.prepare.outputs.publish == 'true' }}
        uses: actions/download-artifact@v4
        with:
          pattern: Micshare-*-${{ needs.prepare.outputs.version }}
          path: ./release-assets
          merge-multiple: true

      - name: List release assets
        if: ${{ needs.prepare.outputs.publish == 'true' }}
        run: ls -la ./release-assets/

      - name: Create GitHub Release
        if: ${{ needs.prepare.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SIGNED: ${{ needs.build-android.outputs.signed }}
        shell: bash
        run: |
          set -euo pipefail
          # Segunda guarda: protege contra corrida entre o prepare e este job.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::A release $TAG foi criada durante o build — abortando para não duplicar assets."
            exit 1
          fi

          # Terceira guarda: a tag precisa existir no repositorio. Sem isso,
          # o `gh release create` criaria a tag apontando para a branch padrao
          # (main), e os artefatos seriam publicados com a versao errada.
          if ! gh api "repos/{owner}/{repo}/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::A tag $TAG não existe no repositorio — envie a tag antes de publicar."
            exit 1
          fi

          if [ "$SIGNED" = "true" ]; then
            SIGNED_TEXT="sim (chave de release)"
          else
            SIGNED_TEXT="não (chave de debug — sem secrets de assinatura)"
          fi

          cat > notes.md <<EOF
          ## Micshare v$VERSION

          O celular vira o microfone do PC pela rede local: o áudio é injetado num
          cabo virtual e aparece como microfone no Discord, OBS, Zoom e jogos.

          ### 📥 Artefatos

          | Arquivo | Plataforma |
          |---|---|
          | \`Micshare-$VERSION.apk\` | Android (minSdk 23 / Android 6.0+) |
          | \`Micshare-${VERSION}_x64-setup.exe\` | Windows (instalador NSIS) |
          | \`Micshare-${VERSION}_x64.msi\` | Windows (instalador MSI) |
          | \`Micshare-${VERSION}_x64-portable.exe\` | Windows (portátil, sem instalar) |

          ### 🔌 VB-Cable (obrigatório para usar como microfone)

          **➜ https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip**

          Página oficial e instruções: https://vb-audio.com/Cable/

          > Extraia o ZIP e execute o instalador **como administrador**.
          > **Reinicie o Windows** após instalar.

          ### 🔀 Roteamento

          \`\`\`
          Celular ──UDP 41235──▶ Servidor PC ──cpal──▶ CABLE Input ──▶ CABLE Output ──▶ Discord/OBS/Zoom (microfone)
          \`\`\`

          O Micshare escreve no lado de playback do cabo (\`CABLE Input\`); no
          Discord/OBS/Zoom selecione **CABLE Output** como microfone.

          ### ℹ️ Detalhes

          - Protocolo canônico JSON: beacon UDP \`41234\`, controle WS \`41236\`, áudio UDP \`41235\`.
          - Header de áudio: 16 bytes Big-Endian (\`0x4D53\`) + PCM s16le.
          - APK assinado com chave de release: **$SIGNED_TEXT**.
          EOF

          gh release create "$TAG" ./release-assets/* \
            --title "Micshare v$VERSION" \
            --notes-file notes.md

  summary:
    name: Resumo
    needs: [prepare, build-android, build-windows, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resumo
        shell: bash
        run: |
          {
            echo "### Micshare — ${{ needs.prepare.outputs.tag }}"
            echo ""
            echo "- Versão: \`${{ needs.prepare.outputs.version }}\`"
            echo "- Publicação: ${{ needs.prepare.outputs.publish == 'true' && 'release criada' || 'não publicada (dry-run ou release existente)' }}"
            echo "- APK assinado com chave de release: ${{ needs.build-android.outputs.signed }}"
          } >> "$GITHUB_STEP_SUMMARY"
