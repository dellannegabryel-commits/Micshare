# Project-wide Gradle settings.
#
# Este arquivo e versionado de proposito: um clone limpo (ou o runner do CI)
# precisa de android.useAndroidX=true para compilar o modulo :app.

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true

# O projeto depende de AndroidX (Compose, DataStore, Ktor).
android.useAndroidX=true
android.enableJetifier=true

kotlin.code.style=official

android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Release signing: informe as propriedades abaixo ou as variaveis de ambiente
# ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS e
# ANDROID_KEY_PASSWORD. Sem elas, o build release usa a chave de debug.
# As chaves de release ficam apenas no GitHub Actions (secrets), nunca aqui.
