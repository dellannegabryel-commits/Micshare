[package]
name = "micshare-pc-ui"
version = "0.1.0"
edition = "2021"

[lib]
name = "micshare_pc_ui"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[dependencies]
tauri = { version = "3.0.0-alpha.5", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
cpal = { version = "0.18", features = ["default"] }
socket2 = "0.5"
anyhow = "1.0"
thiserror = "1.0"
parking_lot = "0.12"
crossbeam = "0.8"
bytes = "1.5"
hostname = "0.3"
futures = "0.3"
futures-util = "0.3"
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
tauri-plugin-store = "3.0.0-alpha.3"
tauri-plugin-dialog = "3.0.0-alpha.4"
tauri-plugin-notification = "3.0.0-alpha.3"
tauri-plugin-shell = "3.0.0-alpha.3"
tauri-plugin-fs = "3.0.0-alpha.3"
tauri-plugin-single-instance = "3.0.0-alpha.3"
