[package]
name = "micshare-pc-ui"
version = "0.1.0"
description = "PelancaMic — servidor de microfone para PC"
edition = "2024"
rust-version = "1.85"

[lib]
name = "micshare_pc_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
cpal = "0.18"
tokio-tungstenite = "0.30"
byteorder = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hostname = "0.4"
if-addrs = "0.15"
